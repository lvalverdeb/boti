name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions are pinned to commit SHAs (tag in the trailing comment) so a moved
# tag cannot change what runs here. Bump the SHA and the comment together.

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        # macOS exercises the `walk` open strategy and the Darwin ENOTDIR
        # path in secure_io; Linux asserts the openat2 strategy.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests with coverage
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest --cov=boti --cov-report=term-missing --cov-fail-under=80

  changelog:
    name: Changelog entry
    # A pull request must touch CHANGELOG.md unless it carries the
    # `no-changelog` label (docs-only, CI-only, …). Pushes to main are not
    # gated: the release checklist in RELEASING.md owns the final shape.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: CHANGELOG.md changed in this pull request
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- CHANGELOG.md; then
            echo "::error::CHANGELOG.md was not updated; add an entry under [Unreleased] or label the PR no-changelog"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/ examples/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/ examples/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run mypy
        run: uv run mypy src/
